<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Tracker Home</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>

</head>
<body class="bg-gray-100">

  <!-- NAVBAR -->
   
<div class="bg-white border-b">
     <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">

          <h1 class="text-lg font-semibold">
          <i class="fa-brands fa-github"></i> GitHub Issues Tracker
          </h1>

          <div class="flex items-center gap-3">

              <input id="searchInput"
              class="border rounded-lg px-3 py-2 text-sm"
              placeholder="Search issues...">

              <button id="newIssueBtn"
              class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm">
              + New Issue
              </button>

          </div>
      </div>
</div>

    <div class="max-w-7xl mx-auto p-6">

<!-- FILTER BUTTONS -->

<div class="flex gap-3 mb-6">

    <button id="allBtn"
    class="tabBtn bg-purple-600 text-white px-4 py-2 rounded-lg text-sm">
    All
    </button>

    <button id="openBtn"
    class="tabBtn bg-white border px-4 py-2 rounded-lg text-sm">
    Open
    </button>

    <button id="closedBtn"
    class="tabBtn bg-white border px-4 py-2 rounded-lg text-sm">
    Closed
    </button>

    </div>

    <!-- Summary -->
<div class="bg-white rounded-xl border p-6 mb-6">
    <div class="flex justify-between items-center">

    <div class="flex items-center gap-3">

    <img src="./assets/Aperture.png" class="w-12 h-12">

<div>
  <h2 id="issueCount" class="font-semibold">50 Issues</h2>
  <p class="text-sm text-gray-500">Track and manage your project issues</p>
</div>

</div>

<div class="flex gap-6 text-sm">

  <div class="flex items-center gap-2">
  <span class="w-2 h-2 bg-green-500 rounded-full"></span>
  Open
  </div>

  <div class="flex items-center gap-2">
  <span class="w-2 h-2 bg-purple-500 rounded-full"></span>
  Closed
</div>

</div>

</div>
</div>

    <!-- LOADING -->

    <div id="loader"
            class="flex justify-center py-10 hidden">

            <span class="loading loading-spinner loading-lg text-purple-600"></span>

        </div>

            <!-- ISSUE CARDS -->

            <div id="issuesContainer"
            class="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">

        </div>

</div>

<!-- MODAL -->

<div id="issueModal"
    class="fixed inset-0 bg-black/40 flex items-center justify-center hidden">

    <div class="bg-white rounded-2xl w-[600px] p-8">

        <h2 id="modalTitle"
        class="text-3xl font-bold mb-4"></h2>

        <div id="modalMeta"
        class="flex items-center gap-3 text-sm text-gray-500 mb-5"></div>

        <div id="modalLabels"
        class="flex gap-3 mb-6"></div>

        <p id="modalDesc"
        class="text-gray-600 mb-6"></p>

        <div class="bg-gray-100 rounded-xl p-5 flex justify-between mb-6">

        <div>

        <p class="text-gray-500 text-sm">Assignee:</p>
        <p id="modalUser"
        class="font-semibold"></p>

    </div>

    <div>

    <p class="text-gray-500 text-sm">Priority:</p>

    <span id="modalPriority"
    class="bg-red-500 text-white text-xs px-3 py-1 rounded-full"></span>

    </div>

    </div>

    <div class="flex justify-end">

        <button onclick="closeModal()"
        class="bg-gradient-to-r from-purple-600 to-blue-600 text-white px-6 py-2 rounded-lg">
        Close
        </button>

    </div>

    </div>

</div>

<script src="./script/home.js"></script>


</body>
</html>
